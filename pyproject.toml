[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskline"
version = "0.2.0"
description = "Task execution engine on taskiq: chains, lifecycle hooks, leased heartbeats, lineage tracking in Postgres."
requires-python = ">=3.14"
dependencies = [
    "taskiq>=0.13,<0.14",
    "taskiq-redis>=1.2,<2",
    "taskiq-pipelines>=0.1.4,<0.2",
    "redis>=8,<9",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
]

[project.scripts]
taskline = "taskline.__main__:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/taskline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-m 'not release'"
filterwarnings = ["error::DeprecationWarning"]
markers = [
    "release: slow checks to run before a release (wheel install, speed on a million runs); run with `pytest -m release`",
]

[tool.ruff]
line-length = 100
target-version = "py314"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
